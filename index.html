<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gestão de Pátio JDF</title>
    <style>
        body {
            margin: 0; padding: 0;
            background: radial-gradient(circle at top right, #0d1424 0%, #07090f 100%);
            color: #cbd5e1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh; display: flex; justify-content: center; align-items: center;
        }

        .login-box {
            background: #000000;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(238, 77, 45, 0.1);
            text-align: center;
        }

        .logo-shopee {
            width: 100%; height: 60px;
            background-image: url('https://i.imgur.com/Z0lEejO.png');
            background-size: contain; background-repeat: no-repeat; background-position: center;
            margin-bottom: 10px; transform: scale(1.5);
        }

        .title { color: #94a3b8; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 30px; font-weight: 600;}
        .hub-name { color: #ee4d2d; font-size: 20px; font-weight: bold; letter-spacing: 1px; margin-bottom: 30px; text-shadow: 0 0 10px rgba(238, 77, 45, 0.4);}

        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 12px; color: #64748b; margin-bottom: 8px; font-weight: bold; letter-spacing: 1px; }
       
        input[type="text"], select {
            width: 100%; padding: 14px; font-size: 16px;
            background: #0f172a; border: 1px solid #334155; border-radius: 6px;
            color: #f8fafc; font-family: inherit; box-sizing: border-box; outline: none; transition: 0.3s;
        }
       
        input[type="text"]:focus, select:focus { border-color: #ee4d2d; box-shadow: 0 0 0 2px rgba(238, 77, 45, 0.2); }

        .btn-login {
            width: 100%; padding: 15px; margin-top: 10px;
            background: transparent; color: #ee4d2d;
            border: 2px solid #ee4d2d; border-radius: 6px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            transition: 0.3s; text-transform: uppercase; letter-spacing: 1px;
        }
       
        .btn-login:hover { background: #ee4d2d; color: #fff; box-shadow: 0 0 15px rgba(238, 77, 45, 0.5); }
        .error-msg { color: #ef4444; font-size: 13px; margin-top: 15px; min-height: 20px; display: block; font-weight: 600;}
    </style>

    <!-- Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

    <div class="login-box">
        <div class="logo-shopee"></div>
        <div class="title">SISTEMA DE GESTÃO DE PÁTIO</div>
        <div class="hub-name">📍 JUIZ DE FORA</div>

        <div class="input-group">
            <label>NOME DO OPERADOR</label>
            <input type="text" id="inputNome" placeholder="Digite seu nome..." autocomplete="off">
        </div>

        <div class="input-group">
            <label>SELECIONE SEU POSTO</label>
            <select id="selectLugar">
                <option value="">-- Selecione --</option>
                <option value="Admin">Painel de Controle (Admin)</option>
                <!-- Mesas geradas pelo JS -->
                <optgroup label="Mesas de Atendimento" id="grupoMesas"></optgroup>
                <optgroup label="Retenção">
                    <option value="Final de Fila 1">Final de Fila 1</option>
                    <option value="Final de Fila 2">Final de Fila 2</option>
                    <option value="Final de Fila 3">Final de Fila 3</option>
                </optgroup>
            </select>
        </div>

        <button type="button" class="btn-login" onclick="fazerLogin()" id="btnAcessar">ACESSAR SISTEMA</button>
        <span class="error-msg" id="msgErro"></span>
    </div>

    <script>
        // ==========================================
        // CONFIGURAÇÃO ATIVA: JUIZ DE FORA (jdf-gestao)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyBJQUKw9P0X4f88m-2yOo2W-E1WTyaYzJc",
            authDomain: "jdf-gestao.firebaseapp.com",
            databaseURL: "https://jdf-gestao-default-rtdb.firebaseio.com",
            projectId: "jdf-gestao",
            storageBucket: "jdf-gestao.firebasestorage.app",
            messagingSenderId: "546256867754",
            appId: "1:546256867754:web:e44f14140d3b685a0fdbd3",
            measurementId: "G-S178ZXS9DD"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Limpa o login anterior se o usuário acessou a tela de login
        sessionStorage.clear();

        // Gera as 25 mesas automaticamente no select
        const grupoMesas = document.getElementById('grupoMesas');
        for (let i = 1; i <= 25; i++) {
            let option = document.createElement('option');
            option.value = `Mesa ${i}`;
            option.innerText = `Mesa ${i}`;
            grupoMesas.appendChild(option);
        }

        function mostrarErro(msg) {
            const el = document.getElementById('msgErro');
            el.innerText = msg;
            setTimeout(() => el.innerText = '', 4000);
        }

        function fazerLogin() {
            const nome = document.getElementById('inputNome').value.trim().toUpperCase();
            const lugar = document.getElementById('selectLugar').value;
            const btn = document.getElementById('btnAcessar');

            if (!nome) return mostrarErro("⚠️ Digite seu nome de operador!");
            if (!lugar) return mostrarErro("⚠️ Selecione qual o seu posto!");

            btn.innerText = "VERIFICANDO...";
            btn.disabled = true;

            // Verifica se a mesa já está ocupada
            db.ref('mesasOcupadas').once('value').then(snapshot => {
                let ocupadas = snapshot.val() || [];
               
                // Admin não trava mesa física
                if (lugar !== 'Admin' && ocupadas.includes(lugar)) {
                    btn.innerText = "ACESSAR SISTEMA";
                    btn.disabled = false;
                    return mostrarErro(`⚠️ A ${lugar} já está em uso por outro operador!`);
                }

                // Libera o acesso e salva os dados na sessão
                sessionStorage.setItem('usuarioLogado', nome);
                sessionStorage.setItem('lugarLogado', lugar);

                // Vai para o painel principal
                window.location.href = "painel.html";

            }).catch(error => {
                console.error(error);
                btn.innerText = "ACESSAR SISTEMA";
                btn.disabled = false;
                mostrarErro("⚠️ Erro ao conectar com o banco de dados.");
            });
        }

        // Permite logar apertando Enter
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') fazerLogin();
        });
    </script>
</body>
</html>
